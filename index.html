<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Screening Room</title>
<meta name="theme-color" content="#E8786C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Screening Room">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E8786C;--red-ink:#B8372D;--beige:#F4E6C8;--beige-2:#EAD7AE;
  --gold:#D4A23F;--gold-ink:#7A5410;--felt:#22130F;--ink:#3B1714;--ink-soft:#5E2620;
  --display:"Big Shoulders Display", Impact, sans-serif;
  --body:"Public Sans", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--red);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:540px;margin:0 auto;padding:0 16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold-ink);outline-offset:2px;border-radius:4px}

.board{margin:18px 0 20px;padding:14px;border-radius:10px;background:linear-gradient(#C8952E,#E8BC5A 30%,#B8852A);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 26px rgba(59,23,20,.28)}
.felt{background:repeating-linear-gradient(to bottom,transparent 0 9px,rgba(0,0,0,.55) 9px 11px),var(--felt);border-radius:4px;padding:16px 14px 14px;text-align:center}
.felt .line{display:block;font-family:var(--display);font-weight:800;color:#F7EFE3;text-transform:uppercase;letter-spacing:.08em;line-height:1.05}
.felt .l1{font-size:15px;color:#DCCFC0;letter-spacing:.32em}
.felt .l2{font-size:44px;margin:4px 0 8px}
.felt .l3{font-size:22px}
.felt .l3 b{color:#E8BC5A;font-weight:900}
.letter{display:inline-block}
@media (prefers-reduced-motion:no-preference){ .felt.flip .l3 .letter{animation:flip .38s both} }
@keyframes flip{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:rgba(59,23,20,.14);border-radius:999px;padding:4px;margin-bottom:12px}
.tabs button{border:0;background:none;padding:10px;border-radius:999px;font-weight:600;color:var(--ink-soft)}
.tabs button[aria-selected="true"]{background:var(--beige);color:var(--ink);box-shadow:0 1px 3px rgba(59,23,20,.2)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.search{flex:1;background:rgba(255,246,230,.45);border:1px solid rgba(59,23,20,.25);border-radius:10px;padding:10px 12px;color:var(--ink)}
.search::placeholder{color:var(--ink-soft);opacity:.75}
.filters button{border:1.5px solid rgba(59,23,20,.35);background:none;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--beige)}

.showing{margin:4px 0 22px}
.showing h2,.list-head{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.01em;margin:0 0 4px}
.showing p{margin:0 0 10px;color:var(--ink-soft);font-size:14px}
.reel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 6px}
.reel::-webkit-scrollbar{display:none}
.bill{flex:0 0 152px;scroll-snap-align:start;background:var(--beige);border-top:4px solid var(--gold);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px}
.bill .when{font-size:12px;font-weight:700;color:var(--red-ink)}
.bill .t{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.05}
.bill .note{font-size:12px;font-weight:600;color:var(--gold-ink)}

.list-head{display:flex;justify-content:space-between;align-items:baseline}
.list-head small{font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink-soft)}
ul.tickets{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.ticket{--stubw:72px;position:relative;display:grid;grid-template-columns:1fr var(--stubw);background:var(--beige);border-radius:6px;box-shadow:0 1px 0 rgba(59,23,20,.18)}
.ticket::before,.ticket::after{content:"";position:absolute;right:calc(var(--stubw) - 9px);width:16px;height:16px;border-radius:50%;background:var(--red);pointer-events:none}
.ticket::before{top:-8px}.ticket::after{bottom:-8px}
.main{padding:13px 14px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.title{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05}
.date{font-size:12px;font-weight:600;color:var(--ink-soft);opacity:.8}
.stub{border-left:2px dashed rgba(59,23,20,.3);display:grid;place-items:center}
.punch{width:24px;height:24px;border-radius:50%;border:2px solid rgba(59,23,20,.25)}
.score{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;color:var(--red-ink)}
.unrated{font-size:12px;font-weight:600;color:var(--ink-soft);opacity:.7}
.empty{padding:28px 10px;text-align:center;color:var(--ink-soft);font-weight:500}

footer{margin:28px 0 10px;text-align:center;font-size:13px;line-height:1.6;color:var(--ink-soft)}
footer a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">
  <header class="board" aria-live="polite">
    <div class="felt" id="felt">
      <span class="line l1">Jackson's</span>
      <span class="line l2">Screening Room</span>
      <span class="line l3" id="tally"></span>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-film" aria-selected="true">Films</button>
    <button role="tab" id="tab-book" aria-selected="false">Books</button>
  </div>

  <div class="row">
    <label class="sr" for="q">Search</label>
    <input class="search" id="q" type="search" placeholder="Search the list" autocomplete="off">
  </div>
  <div class="row filters" id="filters">
    <button data-f="todo" aria-pressed="true">To see</button>
    <button data-f="seen" aria-pressed="false">Seen</button>
  </div>

  <section class="showing" id="showing">
    <h2>Now showing</h2>
    <p>In theaters now and opening soon.</p>
    <div class="reel" id="reel"></div>
  </section>

  <main>
    <div class="list-head"><span id="listTitle">To see</span><small id="listCount"></small></div>
    <ul class="tickets" id="list"></ul>
  </main>

  <footer>
    Last updated <span id="updated"></span>.<br>
    Film data from <a href="https://www.themoviedb.org/">TMDB</a>.
  </footer>
</div>

<script>
/* ======================================================================
   THE LIST — the only place to edit.
   Each entry: [title, release (YYYY-MM or YYYY), score]
   score: null = still to see; a number = seen with that rating;
          0 = seen but not yet rated.
   Ties keep the order they appear here.
   ====================================================================== */
const UPDATED = "2026-11-23";
const FILMS = [
 // Seen, ranked
 ["Good Will Hunting","1997-12",9.8],["La La Land","2016-12",9.8],["Inception","2010-07",9.8],
 ["Dead Poets Society","1989-06",9.5],["The Secret Life of Walter Mitty","2013-12",9.3],
 ["A Complete Unknown","2024-12",9.2],["Dune: Part Two","2024-03",9.0],["Django Unchained","2012-12",8.9],
 ["The Dark Knight Rises","2012-07",8.9],["When Harry Met Sally","1989-07",8.7],["Hell or High Water","2016-08",8.6],
 ["The Longest Ride","2015-04",8.6],["Top Gun","1986-05",8.5],["A Time to Kill","1996-07",8.4],["Air","2023-04",8.3],
 ["Shutter Island","2010-02",8.3],["Midnight in Paris","2011-05",8.3],["The Truman Show","1998-06",8.2],
 ["Memento","2001-03",8.2],["Dune","2021-10",8.2],["Knives Out","2019-11",7.9],["Fury","2014-10",7.9],
 ["Free Solo","2018-09",7.5],["Just Go With It","2011-02",7.0],["Crazy, Stupid, Love","2011-07",7.0],
 // To see
 ["The Matrix","1999-03",null],["The Campaign","2012-08",null],["Cast Away","2000-12",null],
 ["Almost Famous","2000-09",null],["The Departed","2006-10",null],["Conan the Destroyer","1984-06",null],
 ["Kill Bill: Vol. 1","2003-10",null],["Kill Bill: Vol. 2","2004-04",null],
 ["All Quiet on the Western Front","2022-10",null],["No Country for Old Men","2007-11",null],
 ["Whiplash","2014-10",null],["The Outsiders","1983-03",null],["That Awkward Moment","2014-01",null],
 ["Wedding Crashers","2005-07",null],["The Greatest Showman","2017-12",null],["Aftersun","2022-10",null],
 ["War Dogs","2016-08",null],["The Revenant","2015-12",null],["The Most Dangerous Game","1932-09",null],
 ["Top Gun: Maverick","2022-05",null],["The Super Mario Bros. Movie","2023-04",null],["Before We Go","2015-09",null],
 ["The Perks of Being a Wallflower","2012-09",null],["Beautiful Boy","2018-10",null],
 ["Manchester by the Sea","2016-11",null],["The Benchwarmers","2006-04",null],["Rango","2011-03",null],
 ["Sully","2016-09",null],["Two Distant Strangers","2021-04",null],["About Time","2013-11",null],
 ["Billy Madison","1995-02",null],["The Boy, the Mole, the Fox and the Horse","2022-12",null],
 ["Meet the Robinsons","2007-03",null],["Groundhog Day","1993-02",null],["The Thing","1982-06",null],
 ["It's a Wonderful Life","1946-12",null],["Asteroid City","2023-06",null],
 ["The Place Beyond the Pines","2013-03",null],["Fantastic Mr. Fox","2009-11",null],["Past Lives","2023-06",null],
 ["The Pursuit of Happyness","2006-12",null],["Seven Days in Utopia","2011-09",null],["Soul","2020-12",null],
 ["Planes, Trains and Automobiles","1987-11",null],["Field of Dreams","1989-04",null],["The Game","1997-09",null],
 ["Greyhound","2020-07",null],["For Love of the Game","1999-09",null],["Sinners","2025-04",null],
 ["The Banshees of Inisherin","2022-10",null],["Arrival","2016-11",null],["Serendipity","2001-10",null],
 ["One Day","2011-08",null],["The Notebook","2004-06",null],
 ["F1","2025-06",null],["Mission: Impossible – The Final Reckoning","2025-05",null],
 ["Captain America: Brave New World","2025-02",null],["Spider-Man: Brand New Day","2026-07",null],
 ["The Odyssey","2026-07",null],["Project Hail Mary","2026-03",null]
];
const BOOKS = [
 // Read, ranked
 ["Greenlights","2020-10",9.2],["The Outsiders","1967-04",9.1],
 // To read
 ["Molecule of Power","",null],["Unbroken","2010-11",null],["What Money Can't Buy","2012-04",null],
 ["Blind Spots","",null],["The 80/20 Principle","1997",null],["The 4-Hour Workweek","2007-04",null],
 ["Sixty-One (Chris Paul)","",null],["Letters from a Stoic","c. 65 AD",null],["Paul Graham's essays","",null],
 ["Can't Hurt Me","2018-12",null],["The Catcher in the Rye","1951-07",null],
 ["The Most Successful Man in the World","",null],["The Four Agreements","1997",null],
 ["The Inner Game of Tennis","1974",null],["Tuesdays with Morrie","1997",null],
 ["I See Buildings Fall Like Lightning","",null],["All the Light We Cannot See","2014-05",null],
 ["All the Pretty Horses","1992-05",null],["Be Water, My Friend","2020-12",null],["A Farewell to Arms","1929-09",null],
 ["Extreme Ownership","2015-10",null],["East of Eden","1952-09",null],["Field of Dreams","",null],
 ["As a Man Thinketh","1903",null],["The Wealth Money Can't Buy","2024",null]
];
/* Fallback for "Now showing" if TMDB can't be reached. */
const SHOWING_FALLBACK = [
 {t:"The Hunger Games: Sunrise on the Reaping",d:"2026-11-20"},{t:"Godzilla Minus Zero",d:"2026-11-06"},
 {t:"Focker In-Law",d:"2026-11-25"},{t:"Violent Night 2",d:"2026-12-04"},
 {t:"Dune: Part Three",d:"2026-12-18",note:"See it in IMAX"},{t:"Avengers: Doomsday",d:"2026-12-18"}
];
/* ====================================================================== */

const TMDB_KEY="46c301c5a304aaed09412003067f675b", TMDB="https://api.themoviedb.org/3";
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtRelease=r=>{ if(!r) return ""; const m=/^(\d{4})-(\d{2})/.exec(r); return m?`${MON[+m[2]-1]} ${m[1]}`:r; };
const toItems=arr=>arr.map(([title,release,score],i)=>({title,release,score,seen:score!==null,order:i}));
const DATA={film:toItems(FILMS),book:toItems(BOOKS)};
const W={film:{todo:"To see",done:"Seen",tallyDone:"seen"},book:{todo:"To read",done:"Read",tallyDone:"read"}};
let tab="film", filter="todo", query="", showing=SHOWING_FALLBACK;

{ const d=new Date(UPDATED+"T12:00:00"); $("updated").textContent=`${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; }

function renderTally(animate){
  const items=DATA[tab], done=items.filter(i=>i.seen).length;
  const parts=[[String(done),1],[` ${W[tab].tallyDone}  /  `,0],[String(items.length-done),1],[" to go",0]];
  const el=$("tally"); el.innerHTML=""; let k=0;
  for(const [text,bold] of parts){
    const holder=bold?document.createElement("b"):el;
    for(const ch of text){ const sp=document.createElement("span"); sp.className="letter"; sp.textContent=ch===" "?" ":ch; sp.style.animationDelay=(k++*18)+"ms"; holder.appendChild(sp); }
    if(bold) el.appendChild(holder);
  }
  const f=$("felt"); f.classList.remove("flip"); if(animate){ void f.offsetWidth; f.classList.add("flip"); }
}
function renderShowing(){
  $("showing").hidden=!(tab==="film"&&filter==="todo");
  const today=new Date(); today.setHours(23,59,59,999);
  $("reel").innerHTML=showing.map(s=>{
    const d=new Date(s.d+"T12:00:00"), open=d<=today;
    return `<div class="bill"><span class="when">${open?"In theaters":"Opens "+MON[d.getMonth()]+" "+d.getDate()}</span>
      <span class="t">${esc(s.t)}</span>${s.note?`<span class="note">${esc(s.note)}</span>`:""}</div>`;
  }).join("");
}
function renderList(){
  const w=W[tab];
  document.querySelector('[data-f="todo"]').textContent=w.todo;
  document.querySelector('[data-f="seen"]').textContent=w.done;
  let items=DATA[tab].filter(i=>filter==="seen"?i.seen:!i.seen);
  const total=items.length;
  if(query) items=items.filter(i=>i.title.toLowerCase().includes(query));
  if(filter==="seen") items=[...items].sort((a,b)=>(b.score||0)-(a.score||0)||a.order-b.order);
  $("listTitle").textContent=filter==="seen"?`${w.done}, ranked`:w.todo;
  $("listCount").textContent=query?`${items.length} of ${total}`:`${total}`;
  $("list").innerHTML=items.length?items.map(i=>{
    const rel=fmtRelease(i.release);
    const stub=!i.seen?`<span class="punch" aria-hidden="true"></span>`
      :i.score?`<span class="score" aria-label="Rated ${i.score.toFixed(1)} out of 10">${i.score.toFixed(1)}</span>`
      :`<span class="unrated">Not rated</span>`;
    return `<li class="ticket"><div class="main"><span class="title">${esc(i.title)}</span>${rel?`<span class="date">${esc(rel)}</span>`:""}</div><div class="stub">${stub}</div></li>`;
  }).join(""):`<li class="empty">${query?"No matches. Clear the search to see the whole list.":"Nothing here yet."}</li>`;
}
function render(animate){ renderTally(animate); renderShowing(); renderList(); }

async function loadShowing(){
  try{
    const q=`api_key=${TMDB_KEY}&language=en-US&region=US&page=1`;
    const [np,up]=await Promise.all([`${TMDB}/movie/now_playing?${q}`,`${TMDB}/movie/upcoming?${q}`].map(u=>fetch(u).then(r=>r.json())));
    const today=new Date().toISOString().slice(0,10), byPop=(a,b)=>b.popularity-a.popularity;
    const now=(np.results||[]).filter(m=>m.release_date&&m.release_date<=today).sort(byPop).slice(0,6);
    const ids=new Set(now.map(m=>m.id));
    const soon=(up.results||[]).filter(m=>m.release_date>today&&!ids.has(m.id)).sort(byPop).slice(0,6).sort((a,b)=>a.release_date.localeCompare(b.release_date));
    const live=[...now,...soon].map(m=>({t:m.title,d:m.release_date}));
    if(live.length>=4){ showing=live; renderShowing(); }
  }catch(e){ /* keep the fallback list */ }
}

$("q").addEventListener("input",e=>{ query=e.target.value.trim().toLowerCase(); renderList(); });
function setFilter(f){ filter=f; document.querySelectorAll("#filters button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===f)); }
$("filters").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; setFilter(b.dataset.f); renderShowing(); renderList(); });
function setTab(t){ tab=t; $("tab-film").setAttribute("aria-selected",t==="film"); $("tab-book").setAttribute("aria-selected",t==="book"); render(true); }
$("tab-film").onclick=()=>setTab("film"); $("tab-book").onclick=()=>setTab("book");

render(true);
loadShowing();
</script>
</body>
</html>
